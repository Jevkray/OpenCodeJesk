<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>OpenCode Studio — Использование</title>
<style>
  :root{--bg:#1e1e1e;--panel:#252526;--panel2:#2d2d30;--text:#f1f1f1;--muted:#9a9a9a;--accent:#3B8FFC;--border:#3a3a3a;--warn:#f59e0b;--bad:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 "Segoe UI",system-ui,sans-serif}
  .wrap{padding:16px 18px 28px}
  h1{font-size:16px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:12px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px 16px;margin-bottom:14px}
  .card h2{font-size:12px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .rowhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:12px}
  .limits{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .limit .top{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px}
  .limit .pct{font-weight:600}
  .bar{height:8px;background:var(--panel2);border-radius:5px;overflow:hidden}
  .bar>i{display:block;height:100%;background:var(--accent)}
  .limit .meta{color:var(--muted);font-size:11px;margin-top:6px}
  .empty{color:var(--muted);font-size:12px}
  .modelrow{margin:9px 0}
  .modelrow .top{display:flex;justify-content:space-between;gap:10px}
  .modelrow .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .modelrow .val{color:var(--muted);white-space:nowrap}
  .stack{display:flex;align-items:flex-end;gap:3px;height:170px;overflow-x:auto}
  .col{flex:1 0 16px;display:flex;flex-direction:column-reverse;height:100%}
  .col .seg{width:100%}
  .axis{display:flex;gap:3px;margin-top:4px;color:var(--muted);font-size:10px;overflow-x:auto}
  .axis span{flex:1 0 16px;text-align:center}
  .legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:11px;color:var(--muted)}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:5px 8px;font-size:12px}
  .pill{background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:12px;white-space:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <div class="rowhead">
    <div><h1>Использование</h1><div class="sub" id="sub">Ожидание данных…</div></div>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="pill" id="today">Сегодня: —</span>
      <select id="month" title="Месяц"></select>
    </div>
  </div>
  <div class="card"><h2>Лимиты подписки</h2><div class="limits" id="limits"></div></div>
  <div class="card"><h2>Расход по моделям</h2><div id="models" class="empty">Нет данных</div></div>
  <div class="card"><h2>Расход по дням месяца</h2><div id="chart" class="stack"></div><div id="axis" class="axis"></div><div id="legend" class="legend"></div></div>
</div>
<script>
var PALETTE=['#3B8FFC','#22d3ee','#f59e0b','#ef4444','#22c55e','#ec4899','#5EACFC','#14b8a6','#eab308','#64748b'];
var SNAP=null,MONTH=null;
function usd(v){return (Number(v)||0).toFixed(4)+'$';}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function monthOf(iso){if(!iso)return null;var d=new Date(iso);if(isNaN(d.getTime()))return null;return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function dayOf(iso){if(!iso)return null;var d=new Date(iso);if(isNaN(d.getTime()))return null;return d.getDate();}
function rows(){return (SNAP&&SNAP.rows)||[];}
function months(){var s={};rows().forEach(function(r){var m=monthOf(r.createdAt);if(m)s[m]=1;});return Object.keys(s).sort().reverse();}
function render(){
  if(!SNAP)return;
  document.getElementById('sub').textContent='Обновлено: '+new Date(SNAP.generatedAt||Date.now()).toLocaleTimeString();
  document.getElementById('today').textContent='Сегодня: '+usd(SNAP.todayCost);
  var sel=document.getElementById('month'),ms=months();
  if(!MONTH||ms.indexOf(MONTH)<0)MONTH=ms[0]||null;
  sel.innerHTML=ms.length?ms.map(function(m){return '<option value="'+m+'"'+(m===MONTH?' selected':'')+'>'+m+'</option>';}).join(''):'<option>—</option>';
  sel.onchange=function(){MONTH=sel.value;render();};
  renderLimits();renderModels();renderHistogram();
}
function renderLimits(){
  var el=document.getElementById('limits'),L=SNAP.limits;
  if(!L||!L.hasGo){el.innerHTML='<div class="empty">Подписка OpenCode Go не обнаружена — показываются только текущие расходы.</div>';return;}
  var items=[['День',L.fivePct,L.fiveUsed,L.fiveLimit,L.fiveResetSec],['Неделя',L.weekPct,L.weekUsed,L.weekLimit,L.weekResetSec],['Месяц',L.monthPct,L.monthUsed,L.monthLimit,L.monthResetSec]];
  el.innerHTML=items.map(function(it){
    var n=it[0],p=Number(it[1])||0,u=it[2],l=it[3],r=Number(it[4])||0,rem=Math.max(0,100-p);
    var col=rem<15?'var(--bad)':rem<40?'var(--warn)':'var(--accent)';
    var rs=r>0?('сброс через '+Math.floor(r/3600)+'ч '+Math.floor((r%3600)/60)+'м'):'';
    return '<div class="limit"><div class="top"><span>'+n+'</span><span class="pct">осталось '+Math.round(rem)+'%</span></div><div class="bar"><i style="width:'+Math.min(100,p)+'%;background:'+col+'"></i></div><div class="meta">'+usd(u)+' из '+usd(l)+' · '+rs+'</div></div>';
  }).join('');
}
function renderModels(){
  var el=document.getElementById('models'),map={};
  rows().filter(function(r){return monthOf(r.createdAt)===MONTH;}).forEach(function(r){map[r.model]=(map[r.model]||0)+(Number(r.cost)||0);});
  var arr=Object.keys(map).map(function(k){return [k,map[k]];}).sort(function(a,b){return b[1]-a[1];});
  if(!arr.length){el.innerHTML='<div class="empty">Нет данных за '+MONTH+'</div>';return;}
  var max=arr[0][1]||1;
  el.innerHTML=arr.map(function(a){return '<div class="modelrow"><div class="top"><span class="name">'+esc(a[0])+'</span><span class="val">'+usd(a[1])+'</span></div><div class="bar" style="margin-top:5px"><i style="width:'+(a[1]/max*100)+'%"></i></div></div>';}).join('');
}
function renderHistogram(){
  var chart=document.getElementById('chart'),axis=document.getElementById('axis'),legend=document.getElementById('legend');
  var rs=rows().filter(function(r){return monthOf(r.createdAt)===MONTH;});
  if(!rs.length){chart.innerHTML='';axis.innerHTML='';legend.innerHTML='<span class="empty">Нет данных за '+MONTH+'</span>';return;}
  var parts=MONTH.split('-'),y=Number(parts[0]),mo=Number(parts[1]),days=new Date(y,mo,0).getDate();
  var perDay={},colorMap={},modelTotal={};
  rs.forEach(function(r){var d=dayOf(r.createdAt);if(!d)return;perDay[d]=perDay[d]||{};perDay[d][r.model]=(perDay[d][r.model]||0)+(Number(r.cost)||0);modelTotal[r.model]=(modelTotal[r.model]||0)+(Number(r.cost)||0);});
  var max=0;Object.keys(perDay).forEach(function(k){var s=0;Object.keys(perDay[k]).forEach(function(m){s+=perDay[k][m];});if(s>max)max=s;});
  var models=Object.keys(modelTotal).sort(function(a,b){return modelTotal[b]-modelTotal[a];});
  models.forEach(function(m,i){colorMap[m]=PALETTE[i%PALETTE.length];});
  var cols='',ax='';
  for(var d=1;d<=days;d++){
    var o=perDay[d]||{},total=0;Object.keys(o).forEach(function(m){total+=o[m];});
    var h=max>0?total/max*100:0,segs='';
    models.forEach(function(m){var v=o[m]||0;if(v<=0)return;var sh=total>0?h*v/total:0;segs+='<div class="seg" style="height:'+sh+'%;background:'+colorMap[m]+'" title="'+esc(m)+': '+usd(v)+'"></div>';});
    cols+='<div class="col" title="'+MONTH+'-'+String(d).padStart(2,'0')+': '+usd(total)+'">'+segs+'</div>';
    ax+='<span>'+d+'</span>';
  }
  chart.innerHTML=cols;axis.innerHTML=ax;
  legend.innerHTML=models.map(function(m){return '<span><i style="background:'+colorMap[m]+'"></i>'+esc(m)+' — '+usd(modelTotal[m])+'</span>';}).join('');
}
if(window.chrome&&window.chrome.webview){window.chrome.webview.addEventListener('message',function(e){SNAP=e.data;render();});}
render();
</script>
</body>
</html>
