<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
{theme-style}
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: var(--vs-bg, #1e1e1e);
        color: var(--vs-text, #cccccc);
        font-size: 13px;
        overflow-y: auto;
    }
    .wrap { padding: 18px 20px 30px; max-width: 1100px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    header h1 { font-size: 16px; font-weight: 600; letter-spacing: .2px; }
    header .sub { color: var(--vs-muted, #888); font-size: 12px; margin-top: 3px; }
    .btn {
        background: var(--vs-accent, #3B8FFC); color: #fff; border: 0; border-radius: 6px;
        padding: 7px 14px; font-size: 12px; cursor: pointer;
    }
    .btn:hover { opacity: .9; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
    .card {
        background: var(--vs-panel, #252526); border: 1px solid var(--vs-border, #3a3a3a);
        border-radius: 10px; padding: 14px 16px;
    }
    .card .label { color: var(--vs-muted, #888); font-size: 11px; text-transform: uppercase; letter-spacing: .6px; }
    .card .value { font-size: 22px; font-weight: 600; margin-top: 6px; }
    .card .hint { color: var(--vs-muted, #888); font-size: 11px; margin-top: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
    .panel {
        background: var(--vs-panel, #252526); border: 1px solid var(--vs-border, #3a3a3a);
        border-radius: 10px; padding: 14px 16px;
    }
    .panel h2 { font-size: 12px; font-weight: 600; color: var(--vs-muted, #aaa); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 12px; }
    .panel.full { grid-column: 1 / -1; }
    svg { display: block; width: 100%; overflow: visible; }
    .bar-rect { fill: var(--vs-accent, #3B8FFC); }
    .bar-rect.alt { fill: var(--c2, #4ec9b0); }
    .axis-label { fill: var(--vs-muted, #888); font-size: 10px; }
    .grid-line { stroke: var(--vs-border, #3a3a3a); stroke-width: 1; }
    .empty { color: var(--vs-muted, #888); font-size: 12px; padding: 20px 0; text-align: center; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { text-align: left; color: var(--vs-muted, #888); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--vs-border, #3a3a3a); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
    td { padding: 7px 8px; border-bottom: 1px solid color-mix(in srgb, var(--vs-border, #3a3a3a) 45%, transparent); }
    tr:last-child td { border-bottom: 0; }
    td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
    .mono { font-family: 'Cascadia Code', Consolas, monospace; }
    .legend { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; font-size: 11px; color: var(--vs-muted, #aaa); }
    .legend span { display: inline-flex; align-items: center; gap: 6px; }
    .dot { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
    .toolbar { display: flex; gap: 8px; align-items: center; }
    .pill { font-size: 11px; color: var(--vs-muted, #888); }
</style>
</head>
<body>
<div class="wrap">
    <header>
        <div>
            <h1>OpenCode Studio &mdash; Usage Statistics</h1>
            <div class="sub" id="generated"></div>
        </div>
        <div class="toolbar">
            <span class="pill" id="source"></span>
            <button class="btn" onclick="refresh()">Refresh</button>
        </div>
    </header>

    <div class="cards">
        <div class="card"><div class="label">Total Cost</div><div class="value" id="kpi-cost">-</div><div class="hint" id="kpi-cost-hint">all sessions</div></div>
        <div class="card"><div class="label">Total Tokens</div><div class="value" id="kpi-tokens">-</div><div class="hint" id="kpi-tokens-hint">input+output+reasoning+cache</div></div>
        <div class="card"><div class="label">Sessions</div><div class="value" id="kpi-sessions">-</div><div class="hint">tracked sessions</div></div>
        <div class="card"><div class="label">Requests</div><div class="value" id="kpi-requests">-</div><div class="hint" id="kpi-requests-hint">current session</div></div>
    </div>

    <div class="grid">
        <div class="panel full">
            <h2>Cost by day</h2>
            <div id="chart-day"></div>
        </div>
        <div class="panel">
            <h2>Tokens by type</h2>
            <div id="chart-tokens"></div>
        </div>
        <div class="panel">
            <h2>Cost by model</h2>
            <div id="chart-model"></div>
        </div>
        <div class="panel full">
            <h2>Current session &mdash; cost per request</h2>
            <div id="chart-session"></div>
        </div>
    </div>

    <div class="panel full">
        <h2>Recent sessions</h2>
        <div id="sessions"></div>
    </div>
</div>

<script>
var STATS = {stats-json};

function fmtMoney(v) { return '$' + (v || 0).toFixed(4); }
function fmtTokens(v) {
    v = v || 0;
    if (v >= 1e9) return (v / 1e9).toFixed(2) + 'B';
    if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
    if (v >= 1e3) return (v / 1e3).toFixed(1) + 'k';
    return String(v);
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function refresh() { try { window.chrome.webview.postMessage('stats-refresh'); } catch (e) { } }

function render() {
    if (!STATS) { document.getElementById('source').textContent = 'No server connection'; return; }

    var t = STATS.totals || {};
    var tok = t.tokens || {};
    document.getElementById('kpi-cost').textContent = fmtMoney(t.cost);
    document.getElementById('kpi-tokens').textContent = fmtTokens(tok.total);
    document.getElementById('kpi-sessions').textContent = t.sessions || 0;
    var cur = STATS.current || {};
    document.getElementById('kpi-requests').textContent = cur.requests != null ? cur.requests : '-';
    document.getElementById('kpi-requests-hint').textContent = cur.title ? ('session: ' + cur.title) : 'current session';
    document.getElementById('generated').textContent = STATS.generatedAt ? ('Generated ' + new Date(STATS.generatedAt).toLocaleString()) : '';

    drawBarChart('chart-day', (STATS.byDay || []).map(function (d) {
        return { label: d.date.slice(5), value: d.cost, sub: fmtTokens(d.tokens) + ' tok' };
    }), { money: true });

    drawDonut('chart-tokens', [
        { label: 'Input', value: tok.input || 0, color: 'var(--c1)' },
        { label: 'Output', value: tok.output || 0, color: 'var(--c2)' },
        { label: 'Reasoning', value: tok.reasoning || 0, color: 'var(--c3)' },
        { label: 'Cache read', value: tok.cacheRead || 0, color: 'var(--c4)' },
        { label: 'Cache write', value: tok.cacheWrite || 0, color: 'var(--c5)' }
    ]);

    drawHBarChart('chart-model', (STATS.byModel || []).slice(0, 7).map(function (m) {
        return { label: m.name, value: m.cost, sub: fmtTokens(m.tokens) + ' tok \u00b7 ' + m.count + ' sessions' };
    }), { money: true });

    var series = (cur.series || []).map(function (p, i) { return { label: '#' + (i + 1), value: p.cost }; });
    drawBarChart('chart-session', series, { money: true });

    renderSessions(STATS.sessions || []);
}

function drawBarChart(id, data, opts) {
    var host = document.getElementById(id);
    if (!data.length) { host.innerHTML = '<div class="empty">No data</div>'; return; }
    var W = host.clientWidth || 700, H = 180, pad = 26, gap = 4;
    var max = Math.max.apply(null, data.map(function (d) { return d.value; })) || 1;
    var n = data.length, bw = (W - pad * 2 - gap * (n - 1)) / n;
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '">';
    s += '<line class="grid-line" x1="' + pad + '" y1="' + (H - pad) + '" x2="' + (W - pad) + '" y2="' + (H - pad) + '"/>';
    for (var i = 0; i < n; i++) {
        var d = data[i];
        var h = Math.max(1, (d.value / max) * (H - pad * 2));
        var x = pad + i * (bw + gap);
        var y = H - pad - h;
        s += '<rect class="bar-rect" x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) + '" rx="2"><title>' + esc(d.label + ': ' + (opts && opts.money ? fmtMoney(d.value) : d.value)) + '</title></rect>';
        if (n <= 16 || i % Math.ceil(n / 12) === 0)
            s += '<text class="axis-label" x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - pad + 12) + '" text-anchor="middle">' + esc(d.label) + '</text>';
    }
    s += '</svg>';
    host.innerHTML = s;
}

function drawHBarChart(id, data, opts) {
    var host = document.getElementById(id);
    if (!data.length) { host.innerHTML = '<div class="empty">No data</div>'; return; }
    var W = host.clientWidth || 460, rowH = 26, labelW = 40;
    var H = data.length * rowH + 10;
    var max = Math.max.apply(null, data.map(function (d) { return d.value; })) || 1;
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" height="' + H + '">';
    for (var i = 0; i < data.length; i++) {
        var d = data[i], y = i * rowH + 4;
        var w = Math.max(1, (d.value / max) * (W - labelW - 10));
        s += '<text class="axis-label" x="0" y="' + (y + 13) + '">' + esc(short(d.label, 22)) + '</text>';
        s += '<rect class="bar-rect alt" x="' + (labelW + 6) + '" y="' + y + '" width="' + w.toFixed(1) + '" height="14" rx="3"><title>' + esc(d.label + ' \u2014 ' + (opts && opts.money ? fmtMoney(d.value) : d.value) + (d.sub ? ' \u00b7 ' + d.sub : '')) + '</title></rect>';
    }
    s += '</svg>';
    host.innerHTML = s;
}

function drawDonut(id, segs) {
    var host = document.getElementById(id);
    var total = segs.reduce(function (a, s) { return a + s.value; }, 0);
    if (!total) { host.innerHTML = '<div class="empty">No data</div>'; return; }
    var size = 170, r = 62, cx = size / 2, cy = size / 2, sw = 18, off = 0;
    var circ = 2 * Math.PI * r;
    var s = '<svg viewBox="0 0 ' + size + ' ' + size + '" height="' + size + '" style="width:auto">';
    segs.forEach(function (seg) {
        var frac = seg.value / total;
        var len = frac * circ;
        s += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="none" stroke="' + seg.color + '" stroke-width="' + sw +
             '" stroke-dasharray="' + len.toFixed(2) + ' ' + (circ - len).toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) +
             '" transform="rotate(-90 ' + cx + ' ' + cy + ')"><title>' + esc(seg.label + ': ' + fmtTokens(seg.value)) + '</title></circle>';
        off += len;
    });
    s += '<text x="' + cx + '" y="' + (cy - 2) + '" text-anchor="middle" fill="var(--vs-text,#ddd)" font-size="15" font-weight="600">' + fmtTokens(total) + '</text>';
    s += '<text x="' + cx + '" y="' + (cy + 15) + '" text-anchor="middle" fill="var(--vs-muted,#888)" font-size="10">tokens</text>';
    s += '</svg>';
    s += '<div class="legend">' + segs.map(function (seg) {
        return '<span><i class="dot" style="background:' + seg.color + '"></i>' + esc(seg.label) + ' \u2014 ' + fmtTokens(seg.value) + '</span>';
    }).join('') + '</div>';
    host.innerHTML = s;
}

function short(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '\u2026' : s; }

function renderSessions(list) {
    var host = document.getElementById('sessions');
    if (!list.length) { host.innerHTML = '<div class="empty">No sessions</div>'; return; }
    list = list.slice().sort(function (a, b) { return (b.updated || 0) - (a.updated || 0); }).slice(0, 15);
    var rows = list.map(function (s) {
        return '<tr>' +
            '<td>' + esc(short(s.title || s.id, 42)) + '</td>' +
            '<td class="mono">' + esc(short(s.model, 26)) + '</td>' +
            '<td>' + esc(s.agent) + '</td>' +
            '<td class="num">' + fmtTokens(s.tokens) + '</td>' +
            '<td class="num">' + fmtMoney(s.cost) + '</td>' +
            '<td class="num">' + (s.updated ? new Date(s.updated).toLocaleDateString() : '') + '</td>' +
            '</tr>';
    }).join('');
    host.innerHTML = '<table><thead><tr><th>Title</th><th>Model</th><th>Agent</th><th class="num">Tokens</th><th class="num">Cost</th><th class="num">Updated</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

render();
window.addEventListener('resize', function () { render(); });
</script>
</body>
</html>
