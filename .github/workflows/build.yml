name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Build
        run: dotnet build vs/OpenCodeJesk.csproj -c Release

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: OpenCodeJesk.vsix
          path: vs/bin/Release/net472/OpenCodeJesk.vsix
